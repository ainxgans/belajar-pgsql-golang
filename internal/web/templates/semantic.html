{{define "content"}}
<h1>Semantic Similarity (pgvector)</h1>
<form id="search-form">
  <select id="product_id"></select>
  <input type="number" id="limit" value="10" min="1" placeholder="limit">
  <button type="submit">Find similar</button>
</form>
<form id="keyword-form" style="margin-top:0.5rem;">
  <input type="text" id="q" placeholder="kata kunci kategori, mis. 'electronics'">
  <button type="submit">Search by keyword</button>
</form>
<div id="results"></div>

<script>
const select = document.getElementById('product_id');
const results = document.getElementById('results');

(async () => {
  try {
    const products = await fetchJSON('api/products/list');
    select.innerHTML = products.map(p => `<option value="${p.id}">${p.name} (id ${p.id})</option>`).join('');
  } catch (err) {
    select.innerHTML = '<option>failed to load products</option>';
  }
})();

async function runSearch(params) {
  const limit = document.getElementById('limit').value || 10;
  params.set('limit', limit);
  results.innerHTML = 'Loading…';
  try {
    const similar = await fetchJSON(`api/search/semantic?${params.toString()}`);
    results.innerHTML = similar.length
      ? `<table>
          <thead><tr><th>id</th><th>name</th><th>dist</th></tr></thead>
          <tbody>${similar.map(p => `
            <tr><td>${p.id}</td><td>${p.name}</td><td>${p.dist.toFixed(4)}</td></tr>
          `).join('')}</tbody>
        </table>`
      : '<p>No results.</p>';
  } catch (err) {
    results.innerHTML = `<p class="error">${err.message}</p>`;
  }
}

document.getElementById('search-form').addEventListener('submit', (e) => {
  e.preventDefault();
  runSearch(new URLSearchParams({ product_id: select.value }));
});

document.getElementById('keyword-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (q) runSearch(new URLSearchParams({ q }));
});
</script>
{{end}}
