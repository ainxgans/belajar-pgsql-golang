{{define "content"}}
<h1>Realtime LISTEN/NOTIFY &rarr; SSE</h1>
<button id="simulate">Simulate order</button>
<span id="sent" style="color:#888;"></span>

<ul id="orders"></ul>

<script>
const list = document.getElementById('orders');
const sent = document.getElementById('sent');

const events = new EventSource('api/events/stream');
events.onmessage = (e) => {
  const order = JSON.parse(e.data);
  const li = document.createElement('li');
  li.className = 'result';
  li.textContent = `#${order.id} — ${order.status} — $${order.total}`;
  list.prepend(li);
};

document.getElementById('simulate').addEventListener('click', async () => {
  sent.textContent = '';
  try {
    await postJSON('api/orders/simulate', {});
    sent.textContent = 'sent';
    setTimeout(() => { sent.textContent = ''; }, 1500);
  } catch (err) {
    sent.textContent = 'Error: ' + err.message;
  }
});
</script>
{{end}}
