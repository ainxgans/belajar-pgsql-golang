services:
  app:
    build: .
    container_name: belajar-pgsql-golang-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@reusable-postgres:5432/playground?sslmode=disable}
      ADDR: ${ADDR:-:8080}
      BASE_PATH: ${BASE_PATH:-/belajar-pgsql-golang}
      AUTO_SEED: ${AUTO_SEED:-true}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - reusable-network

networks:
  reusable-network:
    external: true
